[project]
name = "car-sound-fault-detection"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.4.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
    "tabulate>=0.10.0",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "transformers>=5.22.2",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
